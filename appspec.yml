version: 0.0
os: linux
files:
  - source: ./
    destination: /var/www/picswarm_sever

hooks:
  AfterInstall:
    - location: scripts/deploy.sh
      timeout: 3000
      runas: root
  ApplicationStart:
    - location: scripts/start_application.sh
      timeout: 300
      runas: ubuntu
  ApplicationStop:
    - location: scripts/stop_application.sh
      timeout: 300
      runas: ubuntu